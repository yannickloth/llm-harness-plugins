auto_update: true
debounce_seconds: 300
graphrag_binary: graphrag
index_root: graph-index
# In-flight model calls. A single-slot local server needs 1: extra requests only
# wait in its queue (observed 2026-11-05: nine of ten in-flight calls were idle).
chat_concurrent_requests: 10
embedding_concurrent_requests: 10
# Batch extraction wants short thinking traces: without an effort cap a reasoning
# model can spend the whole max_tokens budget thinking and return no content.
chat_reasoning_effort: low
chat_max_tokens: 0
chat_request_timeout: 0
chat_tokens_per_minute: 0
chat_requests_per_minute: 0

models:
  chat_model: deepseek/deepseek-flash
  chat_api_key_env: DEEPSEEK_API_KEY
  chat_api_base: https://api.deepseek.com/v1
  embedding_provider: openai
  embedding_model: text-embedding-nomic-embed-text-v1.5
  embedding_api_base: http://localhost:1234/v1
  embedding_api_key_env: GRAPHRAG_API_KEY

projects:
  - name: ivp-book-series
    root: /home/nicky/code/ivp-book-series
    latex_root: src/legacy/latex
    exclude:
      - result
      - target
      - downloads
      - .git
      - graph-index
      - tmp
      - build
      - .direnv
      - literature
