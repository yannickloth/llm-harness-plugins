name: session-lifecycle
version: "1.0.0"
description: "Session lifecycle tracking — edit logs, git commit diffing, archival with 30-day retention"
author:
  name: "Yannick Loth"
  url: "https://infolead.eu"
license: "MIT"

hooks:
  session_start:
    - command: java --add-opens java.base/java.util=ALL-UNNAMED --class-path ./session-lifecycle/build/classes SessionLifecycle check-errors "${PI_PROJECT_DIR}"
    - command: java --add-opens java.base/java.util=ALL-UNNAMED --class-path ./session-lifecycle/build/classes SessionLifecycle snapshot-commits "${PI_PROJECT_DIR}" "${PI_SESSION_ID}"
  session_end:
    - command: java --add-opens java.base/java.util=ALL-UNNAMED --class-path ./session-lifecycle/build/classes SessionLifecycle diff-commits "${PI_PROJECT_DIR}" "${PI_SESSION_ID}"
    - command: java --add-opens java.base/java.util=ALL-UNNAMED --class-path ./session-lifecycle/build/classes SessionLifecycle archive "${PI_PROJECT_DIR}" "${PI_SESSION_ID}"
  post_tool_use:
    - command: java --add-opens java.base/java.util=ALL-UNNAMED --class-path ./session-lifecycle/build/classes SessionLifecycle record-edit "${PI_PROJECT_DIR}" "${PI_SESSION_ID}"
